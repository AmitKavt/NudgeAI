name: NudgeAI
options:
  bundleIdPrefix: com.shwairatech
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  NudgeAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NudgeAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shwairatech.nudgeai
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  NudgeAITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NudgeAITests
    dependencies:
      - target: NudgeAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shwairatech.nudgeai.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NudgeAI:
    build:
      targets:
        NudgeAI: all
        NudgeAITests: [test]
    test:
      targets:
        - NudgeAITests
    run:
      config: Debug
