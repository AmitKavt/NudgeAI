name: NudgeAI
options:
  bundleIdPrefix: com.shwairatech
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  NudgeAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NudgeAI
    info:
      path: NudgeAI/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Nudge AI uses the microphone to capture spoken nudges."
        NSSpeechRecognitionUsageDescription: "Nudge AI transcribes your spoken nudges on-device."
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shwairatech.nudgeai
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  NudgeAITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NudgeAITests
    dependencies:
      - target: NudgeAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shwairatech.nudgeai.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NudgeAI:
    build:
      targets:
        NudgeAI: all
        NudgeAITests: [test]
    test:
      targets:
        - NudgeAITests
    run:
      config: Debug
